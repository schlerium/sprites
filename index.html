<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Infinite Grassland</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    background: #000; overflow: hidden; touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #viewport {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  canvas#screen {
    width: 100%; height: 100%; object-fit: contain; aspect-ratio: 240 / 160;
    image-rendering: pixelated; image-rendering: crisp-edges; background: #3a6b2a;
  }
  #overlay { position: absolute; inset: 0; pointer-events: none; user-select: none; }
  .btn { pointer-events: auto; touch-action: none; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.4); color: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; }
  .btn:active, .btn.active { background: rgba(255,255,255,0.35); border-color: #fff; color: #fff; }

  /* Top Bar */
  #topBar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; }
  .nav-grp { display: flex; gap: 10px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 6px; font-size: 18px; }

  /* Shoulders */
  .shoulder { position: absolute; top: 25%; width: 80px; height: 40px; font-size: 22px; font-weight: bold; }
  #btnL { left: 0; border-left: none; border-radius: 0 20px 20px 0; justify-content: flex-end; padding-right: 18px; }
  #btnR { right: 0; border-right: none; border-radius: 20px 0 0 20px; justify-content: flex-start; padding-left: 18px; }

  /* Controls (Positioned high to match your drawn overlay) */
  #dpad {
    position: absolute; bottom: 25vh; left: 16px;
    width: 138px; height: 138px; display: grid;
    grid-template-columns: 46px 46px 46px; grid-template-rows: 46px 46px 46px;
  }
  #up { grid-column: 2; grid-row: 1; border-radius: 8px 8px 0 0; border-bottom: none; }
  #left { grid-column: 1; grid-row: 2; border-radius: 8px 0 0 8px; border-right: none; }
  #dpad-center { grid-column: 2; grid-row: 2; background: rgba(255,255,255,0.14); }
  #right { grid-column: 3; grid-row: 2; border-radius: 0 8px 8px 0; border-left: none; }
  #down { grid-column: 2; grid-row: 3; border-radius: 0 0 8px 8px; border-top: none; }

  #actionCluster { position: absolute; bottom: 25vh; right: 16px; width: 140px; height: 138px; }
  .abtn { position: absolute; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; font-weight: bold; }
  #btnB { bottom: 0; left: 0; }
  #btnA { top: 0; right: 0; }

  #metaCluster { position: absolute; bottom: 18vh; left: 50%; transform: translateX(-50%); display: flex; gap: 24px; }
  .pill-btn { width: 64px; height: 20px; border-radius: 10px; font-size: 9px; font-weight: bold; transform: rotate(-25deg); }

  #coords { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.4); font-size: 11px; font-family: monospace; }

  /* ===== CHECKPOINTS (self-contained — see matching JS block) ===== */
  #checkpointToast {
    position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #eafbe6; font-size: 11px; font-weight: 600;
    padding: 7px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.25);
    opacity: 0; transition: opacity 0.4s; pointer-events: none; white-space: nowrap;
  }
  #checkpointToast.show { opacity: 1; }
  /* ===== END CHECKPOINTS CSS ===== */

  /* Global chat */
  #chatPanel {
    position: absolute; top: 46px; left: 6px; right: 6px; bottom: 75%;
    display: none; flex-direction: column; pointer-events: auto;
    background: rgba(0,0,0,0.82); border: 2px solid #b6e66b; border-radius: 6px; overflow: hidden;
  }
  #chatPanel.show { display: flex; }
  #chatLog { flex: 1; overflow-y: auto; padding: 6px 8px; font-size: 10px; font-family: monospace; color: #eee; }
  #chatLog .msg { margin-bottom: 3px; line-height: 1.3; word-break: break-word; }
  #chatLog .who { font-weight: 700; margin-right: 4px; }
  #chatInputRow { display: flex; border-top: 1px solid rgba(255,255,255,0.25); }
  #chatInput { flex: 1; background: transparent; border: none; color: #eee; font-size: 11px; padding: 7px 8px; font-family: monospace; }
  #chatInput:focus { outline: none; }
  #chatSendBtn { background: rgba(255,255,255,0.12); border: none; color: #7CFC9E; padding: 0 14px; font-size: 11px; font-weight: 700; cursor: pointer; }

  @media (orientation: landscape) {
    .shoulder { top: 22%; }
    #dpad { bottom: 14vh; left: 24px; }
    #actionCluster { bottom: 14vh; right: 24px; }
    #metaCluster { bottom: 8vh; }
  }

  /* Character select screen */
  #charSelect {
    position: fixed; inset: 0; z-index: 1000;
    background: radial-gradient(circle at center, #1e3a24 0%, #0a1a0d 100%);
    display: flex; align-items: center; justify-content: center;
    color: #eafbe6;
  }
  #charSelectPanel { text-align: center; padding: 20px; max-width: 420px; width: 90%; }
  #charSelectPanel h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: 1px; }
  #charSelectSub { margin: 0 0 20px; font-size: 12px; opacity: 0.6; }
  #charOptions { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-bottom: 20px; max-height: 46vh; overflow-y: auto; }
  .charOption {
    width: 130px; padding: 14px 8px; border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06);
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .charOption:hover { background: rgba(255,255,255,0.12); }
  .charOption.selected { border-color: #7CFC9E; background: rgba(124,252,158,0.15); }
  .charOption .thumbWrap {
    width: 84px; height: 84px; margin: 0 auto 10px; border-radius: 8px;
    background: rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .charOption img { width: 42px; height: 56px; object-fit: contain; image-rendering: pixelated; }
  .charOption span { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
  .charOption.locked:not(.unlocked) .thumbWrap::after {
    content: "\1F512"; position: absolute; top: 3px; right: 5px; font-size: 13px;
    filter: drop-shadow(0 0 2px #000);
  }
  #charSelectStatus { font-size: 11px; opacity: 0.55; margin-bottom: 14px; min-height: 14px; }
  #codeGate { display: none; margin: -6px 0 16px; }
  #codeGate.show { display: block; }
  #codeGateLabel { font-size: 11px; opacity: 0.7; margin: 0 0 8px; }
  #codeGateInput {
    width: 110px; text-align: center; letter-spacing: 6px; font-size: 16px;
    padding: 8px 0; border-radius: 6px; border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.3); color: #eafbe6; margin-right: 8px;
  }
  #codeGateSubmit {
    background: rgba(255,255,255,0.15); color: #eafbe6; border: 1px solid rgba(255,255,255,0.35);
    border-radius: 6px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  #codeGateMsg { font-size: 11px; min-height: 14px; margin: 8px 0 0; color: #ff8b8b; }
  #btnStartGame {
    background: #7CFC9E; color: #0a1a0d; border: none; border-radius: 8px;
    font-weight: 700; font-size: 14px; letter-spacing: 1px; padding: 12px 36px;
    cursor: pointer; opacity: 0.4; pointer-events: none; transition: opacity 0.15s;
  }
  #btnStartGame:not(:disabled) { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<div id="charSelect">
  <div id="charSelectPanel">
    <h2>CHOOSE YOUR CHARACTER</h2>
    <p id="charSelectSub">Pick a sprite, then press start</p>
    <div id="charOptions"></div>
    <div id="codeGate">
      <p id="codeGateLabel">Enter code for Admin</p>
      <input id="codeGateInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">
      <button id="codeGateSubmit">UNLOCK</button>
      <p id="codeGateMsg"></p>
    </div>
    <div id="charSelectStatus">Connecting to server…</div>
    <button id="btnStartGame" disabled>START</button>
  </div>
</div>

<div id="viewport">
  <canvas id="screen" width="240" height="160"></canvas>

  <div id="overlay">
    <div id="topBar">
      <div class="nav-grp">
        <div class="btn icon-btn" id="btnSave">&#x2913;</div>
        <div class="btn icon-btn" id="btnLoad">&#x2912;</div>
      </div>
      <div class="nav-grp">
        <div class="btn icon-btn" id="btnChatToggle">&#128172;</div>
        <div class="btn icon-btn" id="btnFastForward">&#x25B7;&#x25B7;</div>
        <div class="btn icon-btn" id="btnMenu">&#x2261;</div>
      </div>
    </div>

    <div id="chatPanel">
      <div id="chatLog"></div>
      <div id="chatInputRow">
        <input id="chatInput" type="text" maxlength="200" placeholder="Type">
        <button id="chatSendBtn">SEND</button>
      </div>
    </div>

    <div class="btn shoulder" id="btnL">L</div>
    <div class="btn shoulder" id="btnR">R</div>

    <div id="dpad">
      <div class="btn" id="up">&#9650;</div>
      <div class="btn" id="left">&#9664;</div>
      <div id="dpad-center"></div>
      <div class="btn" id="right">&#9654;</div>
      <div class="btn" id="down">&#9660;</div>
    </div>

    <div id="actionCluster">
      <div class="btn abtn" id="btnB">B</div>
      <div class="btn abtn" id="btnA">A</div>
    </div>

    <div id="metaCluster">
      <div class="btn pill-btn" id="btnSelect">SELECT</div>
      <div class="btn pill-btn" id="btnStart">START</div>
    </div>

    <div id="coords">x:0 y:0</div>
    <!-- CHECKPOINTS: safe to delete this line along with the matching JS/CSS blocks -->
    <div id="checkpointToast"></div>
  </div>
</div>

<!-- Firebase (Realtime Database) - powers the multiplayer sync -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
(function(){
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const W = 240, H = 160, TILE = 4;
  const SPRITE_W = 21, SPRITE_H = 28;
  // Hitbox is smaller than the sprite artwork ON PURPOSE: it's anchored to
  // the feet (bottom of the sprite) and shorter than the sprite's full
  // height. The uncovered strip at the top (head/shoulders) can visually
  // overlap a sprite standing "in front", so one player can appear to stand
  // partly behind another instead of two solid boxes just butting heads.
  //
  // Each sprite in SPRITE_ROSTER (further down this file) can set its own
  // "hitbox: { w, h }" — this default is only used if a sprite omits it.
  const DEFAULT_HITBOX = { w: 18, h: 25 };
  function hitboxDimsFor(spriteKey){
    const entry = SPRITE_ROSTER.find((s) => s.key === spriteKey);
    return (entry && entry.hitbox) || DEFAULT_HITBOX;
  }
  // TILE FIX: (camX, camY) is now the TOP-LEFT OF THE 16x16 TILE the player
  // stands on (always a multiple of 16), NOT the top-left of the sprite art.
  // The art is drawn relative to that tile (see SPRITE_ART_DX/DY further down),
  // so the hitbox is simply the tile itself — one player = one tile, exactly
  // like GBA. (The per-sprite "hitbox" values in SPRITE_ROSTER are no longer used.)
  function hitboxOf(worldX, worldY /*, spriteKey (unused) */){
    return { x: worldX, y: worldY, w: 16, h: 16 };
  }
  function overlapArea(a, b){
    const ox = Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x));
    const oy = Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
    return ox * oy;
  }
  // curX/curY = where I am right now, nextX/nextY = where I'm trying to move.
  // A move is blocked only if it would push me MORE into another player's
  // hitbox than I already am. If we're already overlapping (e.g. two
  // players spawned on the same spot at once), moves that reduce or hold
  // the overlap are still allowed — otherwise both players would be
  // permanently deadlocked, unable to move at all, the moment they overlap.
  function collidesWithOthers(curX, curY, nextX, nextY){
    const mineNow = hitboxOf(curX, curY, mySprite);
    const mineNext = hitboxOf(nextX, nextY, mySprite);
    const now = Date.now();
    for (const id in remotePlayers){
      const p = remotePlayers[id];
      if (!p || now - (p.t || 0) > STALE_MS) continue;
      const theirs = hitboxOf(p.x, p.y, p.sprite || 'a');
      const before = overlapArea(mineNow, theirs);
      const after = overlapArea(mineNext, theirs);
      if (after > 0 && after >= before) return true;
    }
    return false;
  }

  function hash2(x, y){
    let h = (x * 374761393 + y * 668265263) ^ ((x * 374761393 + y * 668265263) >> 13);
    return (((h * 1274126177) ^ ((h * 1274126177) >> 16)) >>> 0) / 4294967295;
  }

  const BASE = [58, 107, 42], SHADE_LIGHT = [70, 122, 51], SHADE_DARK = [46, 90, 33], BLADE = [83, 140, 60];
  function tileColor(tx, ty){
    const r = hash2(tx, ty);
    return r < 0.06 ? SHADE_DARK : (r < 0.12 ? SHADE_LIGHT : (r < 0.16 ? BLADE : BASE));
  }

  // A small random spawn offset means two people joining at the same
  // instant don't land in the exact same spot (they'd still separate fine
  // even if they did, thanks to the collision fix above, but this avoids
  // it happening at all in the first place).
  // GRID FIX: spawn exactly on the tile grid at (0,0). The old random +/-20px
  // spawn put every player on a different sub-tile "phase", so with 16px
  // whole-tile steps they could never line up with each other or the world
  // blocks. Overlapping spawns are safe: collidesWithOthers() still lets
  // two overlapping players walk apart.
  let camX = 0;
  let camY = 0;
  const SPEED = 1.0; // world px moved per frame WHILE a GBA-style step is in progress (see STEP_SIZE / update() below) — same value as before, so overall walk speed feels unchanged
  const keys = { up: false, down: false, left: false, right: false };

  function bindHold(el, dir){
    const set = (v) => (e) => { keys[dir] = v; el.classList.toggle('active', v); if(e) e.preventDefault(); };
    el.addEventListener('pointerdown', set(true));
    el.addEventListener('pointerup', set(false));
    el.addEventListener('pointerleave', set(false));
    el.addEventListener('pointercancel', set(false));
  }
  bindHold(document.getElementById('up'), 'up');
  bindHold(document.getElementById('down'), 'down');
  bindHold(document.getElementById('left'), 'left');
  bindHold(document.getElementById('right'), 'right');

  function bindHook(id){
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.classList.add('active'); });
    const off = (e) => { if (e) e.preventDefault(); el.classList.remove('active'); };
    el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('pointercancel', off);
  }
  ['btnA','btnB','btnL','btnR','btnSelect','btnStart','btnSave','btnLoad','btnFastForward','btnMenu'].forEach(bindHook);

  // =====================================================================
  //  CHECKPOINTS — fully self-contained, temporary/placeholder feature.
  //  To remove it later: delete this whole block, delete the matching CSS
  //  block marked "CHECKPOINTS" near the top of <style>, delete the
  //  <div id="checkpointToast"> line, and delete the one-line call to
  //  loadSavedCheckpoint(...) inside the auth sign-in handler further down
  //  (also marked "CHECKPOINTS:"). Nothing else in the file depends on
  //  any of this.
  //
  //  30x30 white squares laid out on a fixed grid around the origin (see
  //  CHECKPOINTS note directly below). Standing on one and pressing A saves
  //  your current position to Firebase; it's restored automatically the
  //  next time you sign in, instead of the default random spot near (0,0).
  //
  //  CHECKPOINTS: switched from "N random points with a minimum-spacing
  //  rule" to a plain fixed grid, so checkpoints are dense and predictable
  //  everywhere instead of wherever the RNG happened to land one. Density
  //  is now controlled only by CHECKPOINT_SPACING below (smaller = more
  //  checkpoints, closer together); CHECKPOINT_COUNT and
  //  CHECKPOINT_MIN_SPACING no longer exist.
  //
  //  CHECKPOINTS: the generated layout (the actual x/y of each square) is
  //  cached in localStorage the first time it's generated, and reused on
  //  every later page load. This is what fixes the "checkpoint square is
  //  gone after I sign back in" bug: previously CHECKPOINTS was re-randomized
  //  on every load, so the squares moved away from wherever you'd saved.
  // =====================================================================
  const CHECKPOINT_SIZE = 30;
  const CHECKPOINT_SPACING = 150;   // CHECKPOINTS: grid step in world px (was random scatter before) — smaller = more/closer checkpoints
  const CHECKPOINT_SPREAD = 1200;   // CHECKPOINTS: changed from 2000 -> 1200 (how far the grid extends from the origin in each direction)
  const CHECKPOINT_STORAGE_KEY = 'checkpointLayout_v2'; // CHECKPOINTS: bumped v1 -> v2 so any old cached (random) layout is discarded and regenerated as a grid

  // CHECKPOINTS: a full grid (spacing 150px, out to 1200px from origin) means
  // that walking 600px (10 seconds at this game's move speed) in ANY
  // direction from anywhere near spawn will always cross paths with several
  // checkpoints, not just whichever direction the old RNG happened to favor.
  function generateCheckpoints(){
    const pts = [];
    for (let x = -CHECKPOINT_SPREAD; x <= CHECKPOINT_SPREAD; x += CHECKPOINT_SPACING){
      for (let y = -CHECKPOINT_SPREAD; y <= CHECKPOINT_SPREAD; y += CHECKPOINT_SPACING){
        pts.push({ x, y });
      }
    }
    return pts;
  }

  // CHECKPOINTS: load a previously-saved layout if one exists, otherwise
  // generate a fresh one and save it so it stays fixed from now on.
  function loadOrGenerateCheckpoints(){
    try {
      const saved = localStorage.getItem(CHECKPOINT_STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (err) {
      console.error('Could not read saved checkpoint layout:', err);
    }
    const pts = generateCheckpoints();
    try {
      localStorage.setItem(CHECKPOINT_STORAGE_KEY, JSON.stringify(pts));
    } catch (err) {
      console.error('Could not persist checkpoint layout:', err);
    }
    return pts;
  }
  const CHECKPOINTS = loadOrGenerateCheckpoints(); // CHECKPOINTS: now fixed across reloads (see loadOrGenerateCheckpoints above)

  function checkpointRect(cp){
    return { x: cp.x, y: cp.y, w: CHECKPOINT_SIZE, h: CHECKPOINT_SIZE };
  }

  function drawCheckpoints(){
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const cp of CHECKPOINTS){
      const px = Math.round(SPRITE_X + (cp.x - camX));
      const py = Math.round(SPRITE_Y + (cp.y - camY));
      if (px > -CHECKPOINT_SIZE && px < W && py > -CHECKPOINT_SIZE && py < H){
        ctx.fillRect(px, py, CHECKPOINT_SIZE, CHECKPOINT_SIZE);
      }
    }
  }

  // "Enters" = the player's hitbox touches the checkpoint square at all.
  function checkpointUnderPlayer(){
    const mine = hitboxOf(camX, camY, mySprite);
    return CHECKPOINTS.find((cp) => overlapArea(mine, checkpointRect(cp)) > 0) || null;
  }

  const checkpointToast = document.getElementById('checkpointToast');
  let checkpointToastTimer = null;
  function showCheckpointToast(text){
    checkpointToast.textContent = text;
    checkpointToast.classList.add('show');
    clearTimeout(checkpointToastTimer);
    checkpointToastTimer = setTimeout(() => checkpointToast.classList.remove('show'), 2000);
  }

  async function trySaveCheckpoint(){
    if (!playerId) return;
    const cp = checkpointUnderPlayer();
    if (!cp) return;
    try {
      await firebase.database().ref('playerCheckpoints/' + playerId).set({ x: camX, y: camY, t: Date.now() });
      showCheckpointToast('Checkpoint saved');
    } catch (err) {
      console.error('Checkpoint save failed:', err);
    }
  }

  async function loadSavedCheckpoint(db, uid){
    try {
      const snap = await db.ref('playerCheckpoints/' + uid).once('value');
      const val = snap.val();
      if (val && typeof val.x === 'number' && typeof val.y === 'number') {
        // GRID FIX: older saves were made before 16px whole-tile movement
        // existed, so they can sit off-grid (e.g. x:9 y:6). Snap them down
        // to the tile they're inside (9,6 -> 0,0) and write the corrected
        // spot back so the bad value is gone from the database for good.
        const gx = Math.floor(val.x / STEP_SIZE) * STEP_SIZE;
        const gy = Math.floor(val.y / STEP_SIZE) * STEP_SIZE;
        camX = gx; camY = gy;
        stepping = false; stepProgress = 0; // drop any half-finished step started before this load finished
        if (gx !== val.x || gy !== val.y) {
          db.ref('playerCheckpoints/' + uid).update({ x: gx, y: gy });
        }
      }
    } catch (err) {
      console.error('Could not load saved checkpoint:', err);
    }
  }

  document.getElementById('btnA').addEventListener('pointerdown', () => trySaveCheckpoint());
  window.addEventListener('keydown', (e) => {
    if (e.key === 'a' || e.key === 'z' || e.key === 'Enter') trySaveCheckpoint();
  });
  // =====================================================================
  //  WORLD ASSETS — buildings/houses made of 16x16 blocks, GBA-style.
  //  Self-contained, same spirit as the CHECKPOINTS block above. To remove
  //  it: delete this whole block, delete the drawWorldAssets()/
  //  drawEnterOverlay() calls inside draw() (marked "WORLD ASSETS:"), and
  //  delete the collidesWithWorldAssets(...) check + entering-sequence
  //  hooks inside update() (also marked "WORLD ASSETS:").
  //
  //  HOW TO ADD/EDIT A BUILDING — everything lives in WORLD_ASSET_ROSTER
  //  right below:
  //    - x, y: the world-px position of the TOP-LEFT PIXEL of block r1c1.
  //      Every other block's position is calculated from this one point —
  //      move a whole building by only ever changing x/y.
  //    - rows, cols: how many 16x16 blocks tall/wide the building is
  //      (the sample "Pokemart" below is 4 rows x 4 cols, matching your
  //      reference image).
  //    - blocks: one entry per cell, named r{row}c{col} (1-indexed from the
  //      top-left, so r1c1 is the top-left block, r4c3 is row 4 / column 3).
  //      Each cell is { file, walkable, enter, enterFrames }:
  //        file        — PNG filename, relative to this asset's `base` URL.
  //                      Left "" for you to fill in; a colored placeholder
  //                      square is drawn in its place until you do.
  //        walkable    — can the player stand here? Defaults to false
  //                      (solid) for any field you don't set, so you only
  //                      need to mark the exceptions (like a doorway).
  //        enter       — marks this block as a doorway: stepping onto it
  //                      triggers the placeholder "enter" sequence below.
  //        enterFrames — [] for now; a door-opening animation's PNG
  //                      filenames would go here later.
  //    - asset2 (further down) is an empty template — copy it, rename the

  // ---------- Sprite code locks ----------
  // The real code for a locked sprite is never sent to the browser and never
  // stored in this file. The player's guess is hashed locally, then the
  // browser tries to WRITE that hash to unlockCheck/{their-uid}/{sprite}.
  // A Firebase security rule only allows that write if the hash matches the
  // one YOU stored (server-side only, unreadable to clients) at
  // config/spriteLocks/{sprite}. A wrong guess is rejected with
  // "permission denied" and reveals nothing. A small attempts counter also
  // throttles repeated guessing from the same device.
  const MAX_UNLOCK_ATTEMPTS = 20;
  const unlockedSprites = new Set();

  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function attemptUnlock(spriteKey, code){
    if (!playerId) return { ok: false, msg: 'Still connecting… try again in a sec' };
    const db = firebase.database();
    const attemptsRef = db.ref('unlockAttempts/' + playerId + '/' + spriteKey);
    try {
      const snap = await attemptsRef.once('value');
      const nextCount = (snap.val() || 0) + 1;
      if (nextCount > MAX_UNLOCK_ATTEMPTS) {
        return { ok: false, msg: 'Too many attempts on this device.' };
      }
      await attemptsRef.set(nextCount);
    } catch (err) {
      return { ok: false, msg: 'Too many attempts on this device.' };
    }
    const hash = await sha256Hex(code);
    try {
      await db.ref('unlockCheck/' + playerId + '/' + spriteKey).set(hash);
      return { ok: true };
    } catch (err) {
      return { ok: false, msg: 'Incorrect code' };
    }
  }

  // ---------- Character select ----------
  const codeGate = document.getElementById('codeGate');
  const codeGateInput = document.getElementById('codeGateInput');
  const codeGateMsg = document.getElementById('codeGateMsg');
  const codeGateLabel = document.getElementById('codeGateLabel');
  let pendingLockedSprite = null;

  function selectSprite(el){
    document.querySelectorAll('.charOption').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    mySprite = el.dataset.sprite;
    document.getElementById('btnStartGame').disabled = false;
    codeGate.classList.remove('show');
  }

  document.querySelectorAll('.charOption').forEach((el) => {
    if (LOCKED_SPRITES.includes(el.dataset.sprite)) el.classList.add('locked');
    el.addEventListener('click', () => {
      const key = el.dataset.sprite;
      if (LOCKED_SPRITES.includes(key) && !unlockedSprites.has(key)) {
        pendingLockedSprite = key;
        codeGateLabel.textContent = 'Enter code for Sprite ' + key.toUpperCase();
        codeGateMsg.textContent = '';
        codeGateInput.value = '';
        codeGate.classList.add('show');
        codeGateInput.focus();
        return;
      }
      selectSprite(el);
    });
  });

  document.getElementById('codeGateSubmit').addEventListener('click', async () => {
    if (!pendingLockedSprite) return;
    const code = codeGateInput.value.trim();
    if (!code) return;
    codeGateMsg.style.color = '#eafbe6';
    codeGateMsg.textContent = 'Checking…';
    const result = await attemptUnlock(pendingLockedSprite, code);
    if (result.ok) {
      unlockedSprites.add(pendingLockedSprite);
      const el = document.querySelector('.charOption[data-sprite="' + pendingLockedSprite + '"]');
      el.classList.add('unlocked');
      codeGate.classList.remove('show');
      selectSprite(el);
    } else {
      codeGateMsg.style.color = '#ff8b8b';
      codeGateMsg.textContent = result.msg;
    }
  });
  document.getElementById('btnStartGame').addEventListener('click', () => {
    document.getElementById('charSelect').style.display = 'none';
    startNetworkSync();
    requestAnimationFrame(loop);
  });

  // =====================================================================
  //  GBA MOVEMENT — ported from how Pokemon (GBA) moves the player:
  //  1. Pressing a NEW direction just turns you to face it for one frame
  //     (no movement yet) — that "turning" behavior already existed here.
  //  2. Holding/pressing it again moves you exactly one whole tile
  //     (STEP_SIZE world px). You cannot stop, or be stopped, mid-tile —
  //     a step is all-or-nothing.
  //  3. No diagonals: only one of up/down/left/right is ever acted on.
  //  4. The destination tile is collision-checked ONCE, before the step
  //     starts, as a single whole-tile decision (open or blocked) — never
  //     re-checked pixel-by-pixel while sliding into it.
  //  Point 4 is what fixes the "half open / half closed" hitbox bug: the
  //  old code moved 1px at a time and re-ran the collision check every
  //  single pixel, so a player could end up parked exactly on the
  //  boundary line between an open pixel column and a blocked one. That
  //  can't happen anymore — you're either standing on the tile you
  //  started on, or you've fully arrived on the next one.
  // =====================================================================
  const STEP_SIZE = 16; // GBA MOVEMENT: world-px distance covered by one step (GBA's overworld tile size)

  function update(){
    if (entering){
      // WORLD ASSETS: mid placeholder enter-sequence — ignore all input
      // until it finishes (see updateEnterSequence() in the WORLD ASSETS block).
      updateEnterSequence();
      return;
    }

    const moveDir = keys[facing] ? facing : (keys.up ? 'up' : (keys.down ? 'down' : (keys.left ? 'left' : (keys.right ? 'right' : null))));

    if (stepping){
      // GBA MOVEMENT: mid-step — keep sliding toward the tile we already
      // committed to. Input is ignored until this step finishes, exactly
      // like Pokemon GBA (you can't change direction mid-tile).
      stepProgress += SPEED / STEP_SIZE;
      walkAcc += 1000 / 60;
      if (walkAcc >= WALK_FRAME_MS){
        walkAcc -= WALK_FRAME_MS;
        walkIndex = (walkIndex + 1) % 4;
      }
      if (stepProgress >= 1){
        camX = stepToX; camY = stepToY; // snap exactly onto the tile, no overshoot/rounding drift
        stepping = false; stepProgress = 0;
        // WORLD ASSETS: just arrived on a new tile — if it's a doorway,
        // kick off the placeholder enter sequence (see WORLD ASSETS block).
        const enterBlock = findEnterBlockUnderPlayer();
        if (enterBlock){
          entering = true; enterPhase = 'out'; enterFadeAcc = 0; enterAlpha = 0;
          enterReturnX = stepFromX; enterReturnY = stepFromY;
        }
      } else {
        camX = stepFromX + (stepToX - stepFromX) * stepProgress;
        camY = stepFromY + (stepToY - stepFromY) * stepProgress;
      }
      return;
    }

    if (!moveDir){
      walkIndex = 0; walkAcc = 0; turning = false;
      return;
    }

    if (facing !== moveDir){
      // GBA MOVEMENT: first press of a new direction only turns you to face
      // it — no movement this frame.
      facing = moveDir; turning = true; walkIndex = 0; walkAcc = 0;
      return;
    }
    if (turning){
      turning = false;
      return;
    }

    // GBA MOVEMENT: attempt exactly one whole-tile step in the facing
    // direction. Checked against both other players AND world objects
    // (buildings, trees, etc.) as a single before/after whole-tile test —
    // see collidesWithOthers() and, for world assets, collidesWithWorldAssets().
    let tx = camX, ty = camY;
    if (facing === 'left') tx -= STEP_SIZE;
    if (facing === 'right') tx += STEP_SIZE;
    if (facing === 'up') ty -= STEP_SIZE;
    if (facing === 'down') ty += STEP_SIZE;

    if (!collidesWithOthers(camX, camY, tx, ty) && !collidesWithWorldAssets(tx, ty)){
      stepFromX = camX; stepFromY = camY;
      stepToX = tx; stepToY = ty;
      stepProgress = 0;
      stepping = true;
    } else {
      // Blocked: stand still facing that direction, same as bumping a wall in GBA.
      walkIndex = 0; walkAcc = 0;
    }
  }

  function drawSpriteAt(spriteKey, dir, frameIdx, px, py){
    const set = animsBySprite[spriteKey] || animsBySprite.a;
    const dirAnim = set[dir] || set.down;
    const frame = dirAnim[frameIdx] || dirAnim[0];
    if (frame && frame.complete && frame.naturalWidth > 0){
      ctx.drawImage(frame, px, py, SPRITE_W, SPRITE_H);
    }
  }

  function draw(){
    const startTX = Math.floor(camX / TILE) - 1;
    const startTY = Math.floor(camY / TILE) - 1;
    const tilesX = Math.ceil(W / TILE) + 2;
    const tilesY = Math.ceil(H / TILE) + 2;
    const offX = -(camX - startTX * TILE);
    const offY = -(camY - startTY * TILE);

    for (let j = 0; j < tilesY; j++){
      const ty = startTY + j, py = Math.round(offY + j * TILE);
      for (let i = 0; i < tilesX; i++){
        const tx = startTX + i, px = Math.round(offX + i * TILE);
        const c = tileColor(tx, ty);
        ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
        ctx.fillRect(px, py, TILE, TILE);
      }
    }

    drawCheckpoints(); // CHECKPOINTS: delete this line if removing the feature

    // LAYERING (y-sort): blocks and players are drawn together, top row to
    // bottom row. A block in a row ABOVE (north of) a player is drawn first,
    // so the player stands in front of it; a block in a row BELOW (south of)
    // a player is drawn after, so it covers him (roof over your head when you
    // walk behind a shop). Blocks with overPlayer:true always go on top.
    const drawList = [];
    for (const b of WORLD_BLOCKS){
      if (b.conflicted) continue; // WORLD ASSETS: overlapping placement — render nothing until it's fixed
      drawList.push({ k: b.overPlayer ? 1e9 : b.y, fn: () => drawWorldBlock(b) });
    }
    const now = Date.now();
    for (const id in remotePlayers){
      const p = remotePlayers[id];
      if (!p || now - (p.t || 0) > STALE_MS) continue;
      const px = Math.round(SPRITE_X + (p.x - camX)) + SPRITE_ART_DX;
      const py = Math.round(SPRITE_Y + (p.y - camY)) + SPRITE_ART_DY;
      if (px > -SPRITE_W && px < W && py > -SPRITE_H && py < H){
        drawList.push({ k: p.y + 0.5, fn: () => drawSpriteAt(p.sprite || 'a', p.facing || 'down', p.walkIndex || 0, px, py) });
      }
    }
    // Local player (always centered on screen); +0.51 so on a tie he draws above other players
    drawList.push({ k: camY + 0.51, fn: () => drawSpriteAt(mySprite, facing, walkIndex, SPRITE_X + SPRITE_ART_DX, SPRITE_Y + SPRITE_ART_DY) });
    drawList.sort((a, b) => a.k - b.k);
    for (const item of drawList) item.fn();

    drawEnterOverlay(); // WORLD ASSETS: delete this line if removing the feature — must stay last so it covers everything else

    document.getElementById('coords').textContent = 'x:' + Math.round(camX) + ' y:' + Math.round(camY);
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }
  // Loop is kicked off once the player picks a sprite and hits START (see character select above)
})();
</script>
</body>
</html>
