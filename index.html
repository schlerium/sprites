<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Infinite Grassland</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    background: #000; overflow: hidden; touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #viewport {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  canvas#screen {
    width: 100%; height: 100%; object-fit: contain; aspect-ratio: 240 / 160;
    image-rendering: pixelated; image-rendering: crisp-edges; background: #3a6b2a;
  }
  #overlay { position: absolute; inset: 0; pointer-events: none; user-select: none; }
  .btn { pointer-events: auto; touch-action: none; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.4); color: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; }
  .btn:active, .btn.active { background: rgba(255,255,255,0.35); border-color: #fff; color: #fff; }

  /* Top Bar */
  #topBar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; }
  .nav-grp { display: flex; gap: 10px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 6px; font-size: 18px; }

  /* Shoulders */
  .shoulder { position: absolute; top: 25%; width: 80px; height: 40px; font-size: 22px; font-weight: bold; }
  #btnL { left: 0; border-left: none; border-radius: 0 20px 20px 0; justify-content: flex-end; padding-right: 18px; }
  #btnR { right: 0; border-right: none; border-radius: 20px 0 0 20px; justify-content: flex-start; padding-left: 18px; }

  /* Controls (Positioned high to match your drawn overlay) */
  #dpad {
    position: absolute; bottom: 25vh; left: 16px;
    width: 138px; height: 138px; display: grid;
    grid-template-columns: 46px 46px 46px; grid-template-rows: 46px 46px 46px;
  }
  #up { grid-column: 2; grid-row: 1; border-radius: 8px 8px 0 0; border-bottom: none; }
  #left { grid-column: 1; grid-row: 2; border-radius: 8px 0 0 8px; border-right: none; }
  #dpad-center { grid-column: 2; grid-row: 2; background: rgba(255,255,255,0.14); }
  #right { grid-column: 3; grid-row: 2; border-radius: 0 8px 8px 0; border-left: none; }
  #down { grid-column: 2; grid-row: 3; border-radius: 0 0 8px 8px; border-top: none; }

  #actionCluster { position: absolute; bottom: 25vh; right: 16px; width: 140px; height: 138px; }
  .abtn { position: absolute; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; font-weight: bold; }
  #btnB { bottom: 0; left: 0; }
  #btnA { top: 0; right: 0; }

  #metaCluster { position: absolute; bottom: 18vh; left: 50%; transform: translateX(-50%); display: flex; gap: 24px; }
  .pill-btn { width: 64px; height: 20px; border-radius: 10px; font-size: 9px; font-weight: bold; transform: rotate(-25deg); }

  #coords { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.4); font-size: 11px; font-family: monospace; }

  @media (orientation: landscape) {
    .shoulder { top: 22%; }
    #dpad { bottom: 14vh; left: 24px; }
    #actionCluster { bottom: 14vh; right: 24px; }
    #metaCluster { bottom: 8vh; }
  }
</style>
</head>
<body>

<div id="viewport">
  <canvas id="screen" width="240" height="160"></canvas>

  <div id="overlay">
    <div id="topBar">
      <div class="nav-grp">
        <div class="btn icon-btn" id="btnSave">&#x2913;</div>
        <div class="btn icon-btn" id="btnLoad">&#x2912;</div>
      </div>
      <div class="nav-grp">
        <div class="btn icon-btn" id="btnFastForward">&#x25B7;&#x25B7;</div>
        <div class="btn icon-btn" id="btnMenu">&#x2261;</div>
      </div>
    </div>

    <div class="btn shoulder" id="btnL">L</div>
    <div class="btn shoulder" id="btnR">R</div>

    <div id="dpad">
      <div class="btn" id="up">&#9650;</div>
      <div class="btn" id="left">&#9664;</div>
      <div id="dpad-center"></div>
      <div class="btn" id="right">&#9654;</div>
      <div class="btn" id="down">&#9660;</div>
    </div>

    <div id="actionCluster">
      <div class="btn abtn" id="btnB">B</div>
      <div class="btn abtn" id="btnA">A</div>
    </div>

    <div id="metaCluster">
      <div class="btn pill-btn" id="btnSelect">SELECT</div>
      <div class="btn pill-btn" id="btnStart">START</div>
    </div>

    <div id="coords">x:0 y:0</div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const W = 240, H = 160, TILE = 4;
  const SPRITE_W = 21, SPRITE_H = 28;
  const SPRITE_BASE = "https://raw.githubusercontent.com/schlerium/sprites/main/";

  function hash2(x, y){
    let h = (x * 374761393 + y * 668265263) ^ ((x * 374761393 + y * 668265263) >> 13);
    return (((h * 1274126177) ^ ((h * 1274126177) >> 16)) >>> 0) / 4294967295;
  }

  const BASE = [58, 107, 42], SHADE_LIGHT = [70, 122, 51], SHADE_DARK = [46, 90, 33], BLADE = [83, 140, 60];
  function tileColor(tx, ty){
    const r = hash2(tx, ty);
    return r < 0.06 ? SHADE_DARK : (r < 0.12 ? SHADE_LIGHT : (r < 0.16 ? BLADE : BASE));
  }

  let camX = 0, camY = 0;
  const SPEED = 1.0;
  const keys = { up: false, down: false, left: false, right: false };

  function bindHold(el, dir){
    const set = (v) => (e) => { keys[dir] = v; el.classList.toggle('active', v); if(e) e.preventDefault(); };
    el.addEventListener('pointerdown', set(true));
    el.addEventListener('pointerup', set(false));
    el.addEventListener('pointerleave', set(false));
    el.addEventListener('pointercancel', set(false));
  }
  bindHold(document.getElementById('up'), 'up');
  bindHold(document.getElementById('down'), 'down');
  bindHold(document.getElementById('left'), 'left');
  bindHold(document.getElementById('right'), 'right');

  function bindHook(id){
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.classList.add('active'); });
    const off = (e) => { if (e) e.preventDefault(); el.classList.remove('active'); };
    el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off);
    el.addEventListener('pointercancel', off);
  }
  ['btnA','btnB','btnL','btnR','btnSelect','btnStart','btnSave','btnLoad','btnFastForward','btnMenu'].forEach(bindHook);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp') keys.up = true;
    if (e.key === 'ArrowDown') keys.down = true;
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp') keys.up = false;
    if (e.key === 'ArrowDown') keys.down = false;
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  function makeFrame(file){
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = SPRITE_BASE + file;
    return img;
  }

  const anims = {
    down:  [makeFrame("MV1.png"), makeFrame("MV2.png"), makeFrame("MV1.png"), makeFrame("MV3.png")],
    up:    [makeFrame("MB1.png"), makeFrame("MB2.png"), makeFrame("MB1.png"), makeFrame("MB3.png")],
    left:  [makeFrame("ML0.png"), makeFrame("ML1.png"), makeFrame("ML0.png"), makeFrame("ML2.png")],
    right: [makeFrame("MR0.png"), makeFrame("MR1.png"), makeFrame("MR0.png"), makeFrame("MR2.png")]
  };

  let walkIndex = 0, walkAcc = 0, facing = 'down', turning = false;
  const WALK_FRAME_MS = 1000 / 7;
  const SPRITE_X = Math.floor((W - SPRITE_W) / 2);
  const SPRITE_Y = Math.floor((H - SPRITE_H) / 2);

  function update(){
    let dx = 0, dy = 0;
    if (keys.left) dx -= 1;
    if (keys.right) dx += 1;
    if (keys.up) dy -= 1;
    if (keys.down) dy += 1;
    if (dx !== 0 && dy !== 0){ dx *= 0.7071; dy *= 0.7071; }

    const moveDir = keys[facing] ? facing : (keys.up ? 'up' : (keys.down ? 'down' : (keys.left ? 'left' : (keys.right ? 'right' : null))));
    if (moveDir){
      if (facing !== moveDir){
        facing = moveDir; turning = true; walkIndex = 0; walkAcc = 0; dx = 0; dy = 0;
      } else if (turning){
        turning = false; dx = 0; dy = 0;
      } else {
        walkAcc += 1000 / 60;
        if (walkAcc >= WALK_FRAME_MS){
          walkAcc -= WALK_FRAME_MS;
          walkIndex = (walkIndex + 1) % 4;
        }
      }
    } else {
      walkIndex = 0; walkAcc = 0; turning = false;
    }

    camX += dx * SPEED;
    camY += dy * SPEED;
  }

  function draw(){
    const startTX = Math.floor(camX / TILE) - 1;
    const startTY = Math.floor(camY / TILE) - 1;
    const tilesX = Math.ceil(W / TILE) + 2;
    const tilesY = Math.ceil(H / TILE) + 2;
    const offX = -(camX - startTX * TILE);
    const offY = -(camY - startTY * TILE);

    for (let j = 0; j < tilesY; j++){
      const ty = startTY + j, py = Math.round(offY + j * TILE);
      for (let i = 0; i < tilesX; i++){
        const tx = startTX + i, px = Math.round(offX + i * TILE);
        const c = tileColor(tx, ty);
        ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
        ctx.fillRect(px, py, TILE, TILE);
      }
    }

    const curFrame = (anims[facing] || anims.down)[walkIndex];
    if (curFrame && curFrame.complete && curFrame.naturalWidth > 0){
      ctx.drawImage(curFrame, SPRITE_X, SPRITE_Y, SPRITE_W, SPRITE_H);
    }
    document.getElementById('coords').textContent = 'x:' + Math.round(camX) + ' y:' + Math.round(camY);
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
